name: .NET 8 build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Mft.sln
      - name: Build
        run: dotnet build Mft.sln --configuration Release --no-restore
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: Frontend build
        working-directory: frontend
        run: npm run build
