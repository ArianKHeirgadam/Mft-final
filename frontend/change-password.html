<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغییر رمز عبور | MFT</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;width:min(420px,90%);padding:32px;border-radius:16px;box-shadow:0 10px 35px #0001}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}.hint{font-size:13px;color:#666}#toast{margin-top:12px}</style></head>
<body><main class="card"><h2>تغییر رمز عبور</h2><p class="hint">رمز موقت فقط برای اولین ورود است. یک رمز جدید حداقل ۸ کاراکتری انتخاب کنید.</p><form id="changePasswordForm"><label>رمز فعلی</label><input id="currentPassword" type="password" required><label>رمز جدید</label><input id="newPassword" type="password" minlength="8" required><label>تکرار رمز جدید</label><input id="confirmPassword" type="password" minlength="8" required><button type="submit">تغییر رمز و ورود</button></form><div id="toast"></div></main>
<script>function showToast(m){document.getElementById('toast').textContent=m;}</script><script src="assets/js/api.js"></script></body></html>
